<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--bg:#f4f7fb;--card:#fff;--ink:#152033;--muted:#617087;--line:#dce3ed;--bad:#c62828;--bad-bg:#fff1f1;--bad-line:#efb6b6;--warn:#a35b00;--good:#18794e;--good-bg:#edf9f2;--good-line:#a9d9bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1280px;margin:auto;padding:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h1{margin:0;font-size:26px}.report-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}
.verdict{min-width:280px;border:1px solid;border-radius:12px;padding:14px 18px}.verdict--pass{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}.verdict--fail{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.verdict-label{font-size:12px;font-weight:700;letter-spacing:.08em}.verdict-value{font-size:28px;line-height:1.2;font-weight:800;margin:4px 0}.verdict-detail{font-size:13px}.verdict-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.8}
.meta{color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px}.meta>div{min-width:0;overflow-wrap:anywhere}
.scope{margin-top:12px;padding:10px 12px;border-left:4px solid #1f4e78;background:#edf2f8;color:var(--muted)}
.P0,.P1,.FAIL{color:var(--bad)}.P2,.MANUAL_VERIFY,.NOT_ASSESSABLE{color:var(--warn)}.PASS{color:var(--good)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap}.toolbar select,.toolbar input{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.table-wrap{overflow-x:auto}table{width:100%;min-width:980px;table-layout:fixed;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{position:sticky;top:0;background:#edf2f8}th:nth-child(1){width:8%}th:nth-child(2){width:6%}th:nth-child(3){width:8%}th:nth-child(4){width:32%}th:nth-child(5){width:46%}tbody tr:hover{background:#f8fafc}
.rule-detail{width:100%;max-width:640px}.rule-detail>summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s}.rule-detail>summary:hover{background:#edf2f8;border-color:#b8c5d6}.rule-detail>summary:focus-visible{outline:3px solid rgba(31,78,120,.3);outline-offset:2px}.detail-count{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}.detail-body{padding:12px 2px 2px}.detail-section{margin-bottom:14px}.detail-section:last-child{margin-bottom:0}.detail-section h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted)}.detail-section p{margin:0;white-space:pre-wrap;word-break:break-word}
.evidence-card{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:10px}.evidence-card:last-child{margin-bottom:0}.evidence-card-title{padding:7px 10px;background:#edf2f8;font-size:12px;font-weight:800;color:#334155}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0}.evidence-field{min-width:0;padding:9px 10px;border-top:1px solid var(--line)}.evidence-field:nth-child(odd){border-right:1px solid var(--line)}.evidence-field--wide{grid-column:1/-1;border-right:0!important}.evidence-field dt{margin:0 0 3px;font-size:11px;font-weight:700;color:var(--muted)}.evidence-field dd{margin:0;min-width:0;word-break:break-word}.field-value{font-weight:600;color:#26364d}.empty-value,.empty-evidence{color:var(--muted);font-style:italic}.empty-evidence{padding:10px;border:1px dashed var(--line);border-radius:8px;background:#fafbfd}
.chip-list,.source-list{display:flex;gap:6px;flex-wrap:wrap}.chip,.source-chip{display:inline-flex;align-items:center;min-height:26px;padding:3px 8px;border-radius:999px;background:#e8eef6;color:#334155;font-size:12px;font-weight:650}.source-chip{background:#edf2f8;border:1px solid var(--line)}.reason-code{display:block;width:max-content;max-width:100%;margin-top:4px;padding:2px 6px;border-radius:5px;background:#eef2f7;color:#526176;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:normal;overflow-wrap:anywhere}.code-block{margin:4px 0 0;padding:10px;border-radius:8px;background:#182334;color:#edf4ff;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;overflow:auto}.nested-fields,.nested-list{display:grid;gap:6px}.nested-field{display:grid;grid-template-columns:minmax(90px,.4fr) 1fr;gap:8px}.nested-field>span{color:var(--muted);font-size:12px}.nested-item{padding:7px;border:1px solid var(--line);border-radius:7px;background:#fafbfd}.detail-section--impact,.detail-section--recommendation{padding:10px 12px;border-left:4px solid;border-radius:6px}.detail-section--impact{border-color:#c62828;background:#fff4f4}.detail-section--recommendation{border-color:#1f4e78;background:#f0f5fa}
@media(max-width:760px){body{font-size:16px}main{padding:14px}.report-header{display:block}.verdict{min-width:0;margin-top:16px}.evidence-grid{grid-template-columns:1fr}.evidence-field,.evidence-field:nth-child(odd){grid-column:1;border-right:0}.rule-detail{max-width:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.toolbar{display:none}body{background:#fff}main{max-width:none;padding:0}.card{border:0;break-inside:avoid}th{position:static}.verdict{border:2px solid}.table-wrap{overflow:visible}table{min-width:0}.rule-detail{max-width:none}.rule-detail>summary{display:none}.rule-detail:not([open])>.detail-body{display:block}.evidence-card{break-inside:avoid}}
</style>
</head>
<body><main>
<section class="card">
<div class="report-header"><h1>{{TITLE}}</h1><div class="verdict verdict--{{VERDICT_TONE}}" role="status" aria-label="总体检查结论"><div class="verdict-label">总体检查结论</div><div class="verdict-value">{{VERDICT_LABEL}}</div><div class="verdict-detail">{{VERDICT_DETAIL}} · <span class="verdict-code">{{OVERALL_STATUS}}</span></div></div></div>
<div class="meta">{{META}}</div><div class="scope">{{SCOPE_NOTICE}}</div></section>
<section class="card toolbar">
<label>状态 <select id="filterStatus"><option value="">全部</option>{{STATUS_OPTIONS}}</select></label>
<label>等级 <select id="filterSeverity"><option value="">全部</option>{{SEVERITY_OPTIONS}}</select></label>
<label>搜索 <input id="filterText" type="search" placeholder="Rule ID 或标题"></label>
</section>
<section class="card table-wrap"><table><thead><tr><th>Rule ID</th><th>等级</th><th>结论</th><th>检查项</th><th>证据与建议</th></tr></thead><tbody id="ruleRows">{{ROWS}}</tbody></table></section>
</main>
<script>
const statusEl=document.getElementById('filterStatus'),severityEl=document.getElementById('filterSeverity'),textEl=document.getElementById('filterText');
function filterRows(){const s=statusEl.value,v=severityEl.value,q=textEl.value.toLowerCase();document.querySelectorAll('#ruleRows tr').forEach(row=>{const ok=(!s||row.dataset.status===s)&&(!v||row.dataset.severity===v)&&(!q||row.innerText.toLowerCase().includes(q));row.hidden=!ok;});}
[statusEl,severityEl,textEl].forEach(el=>el.addEventListener('input',filterRows));
</script></body></html>
